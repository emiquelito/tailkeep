# Runs the same checks as .githooks/pre-commit on every push to main and on
# every pull request. Actions are pinned to full commit SHAs (the comment
# names the release); the runner image is pinned too, so it changes only when
# someone edits this file.

name: delivery gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The prose scan reads tracked files and the test diff check reads
          # history. A shallow clone hides both.
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - run: npm ci

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt -l lists files that are not formatted:"
            echo "$out"
            exit 1
          fi

      - name: hygiene
        # TAILKEEP_HYGIENE_PRIVATE (the owner-specific values) is never set in
        # CI, so that one rule is skipped. The annotation keeps that visible.
        run: |
          echo "::notice title=hygiene::owner-value rule skipped: TAILKEEP_HYGIENE_PRIVATE is not set in CI"
          go test -tags hygiene -count=1 -run TestRepoHygiene ./internal/hygiene

      - name: tests
        run: npm test

      - name: prose scan
        run: npx --no-install agent-delivery-gates scan-prose --require-rules

      - name: tally check
        run: npx --no-install agent-delivery-gates tally --check

  test-diff:
    # Reports test changes apart from source changes for a pull request.
    # Exits 1 when it finds a weakening signal.
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - run: npm ci

      - name: report the test diff apart from the source diff
        # shell: bash adds pipefail, so tee does not hide the exit code.
        shell: bash
        run: |
          npx --no-install agent-delivery-gates test-diff \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}" \
            | tee "$GITHUB_STEP_SUMMARY"
